name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to receive the package assets"
        required: true
        default: v1.0.0
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish GitHub Release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload package assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Local LLM DevSecOps $RELEASE_TAG" \
              --generate-notes
          fi

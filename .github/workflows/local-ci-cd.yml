name: Local DevSecOps CI CD
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: "Select lightweight checks, local release, or full scan"
        required: true
        default: check
        type: choice
        options: [check, release, full]

permissions:
  contents: read

concurrency:
  group: local-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_tests:
    name: "01 | Pytest focused service and chat checks"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: uv run --with-requirements requirements.txt --with pytest pytest -q tests/test_services.py::test_catalog_contract tests/test_services.py::test_gateway_serves_web_chat

  ruff_lint:
    name: "02 | Ruff lint"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: uvx ruff check services jobs tests

  ruff_format:
    name: "03 | Ruff format"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: uvx ruff format --check services jobs tests

  helm_lint:
    name: "04 | Helm chart lint"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: helm lint charts/app

  helm_render:
    name: "05 | Kubernetes manifest render"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: helm template demo charts/app --set imageTag=check > /tmp/local-llm-rendered.yaml

  hadolint:
    name: "06 | Dockerfile lint"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: if command -v hadolint >/dev/null; then hadolint --ignore DL3008 containers/*.Dockerfile; else echo 'Hadolint unavailable'; fi

  shell_syntax:
    name: "07 | Shell syntax"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh

  tofu_format:
    name: "08 | OpenTofu format"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: tofu -chdir=infra/cluster fmt -check

  web_chat:
    name: "09 | Browser chat contract"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: uv run --with-requirements requirements.txt --with pytest pytest -q tests/test_services.py::test_gateway_serves_web_chat

  model_manifest:
    name: "10 | Pinned model manifest"
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'check'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c 'import json; x=json.load(open("model/manifest.json")); assert len(x["revision"]) == 40 and len(x["sha256"]) == 64 and x["license"] == "Apache-2.0"; print("Pinned revision, SHA-256, and license verified")'

  release:
    name: "Release | Docker Kind Helm Web Chat"
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'release'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    environment: laptop-release
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/pipeline.sh release dev

  full_scan:
    name: "Full Scan | Trivy SBOM Docker"
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'full'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/pipeline.sh full

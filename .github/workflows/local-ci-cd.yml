name: Local DevSecOps CI CD
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: "Select parallel checks, local release, or full scan"
        required: true
        default: check
        type: choice
        options: [check, release, full]

permissions:
  contents: read

concurrency:
  group: local-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkout:
    name: "Checkout | Source"
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: git status --short

  app_tests:
    name: "App | Focused Pytest and Ruff"
    needs: checkout
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - name: Run focused tests and Python lint
        run: |
          uv run --with-requirements requirements.txt --with pytest --with ruff pytest -q tests/test_services.py::test_catalog_contract tests/test_services.py::test_gateway_serves_web_chat
          uvx ruff check services jobs tests
          uvx ruff format --check services jobs tests

  helm_checks:
    name: "Kubernetes | Helm lint and render"
    needs: checkout
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - name: Validate and render app chart
        run: |
          helm lint charts/app
          helm template demo charts/app --set imageTag=check > /tmp/local-llm-rendered.yaml

  infrastructure_checks:
    name: "Infrastructure | OpenTofu and shell syntax"
    needs: checkout
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - name: Format IaC and parse scripts
        run: |
          tofu -chdir=infra/cluster fmt -check
          bash -n scripts/*.sh

  container_checks:
    name: "Containers | Hadolint and pinned bases"
    needs: checkout
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles and verify base digests
        run: |
          if command -v hadolint >/dev/null; then hadolint --ignore DL3008 containers/*.Dockerfile; else echo 'Hadolint unavailable'; fi
          grep -Eq '^FROM .+@sha256:' containers/app.Dockerfile
          grep -Eq '^FROM .+@sha256:' containers/llm.Dockerfile

  model_web_checks:
    name: "Model and Web | Manifest and chat contract"
    needs: checkout
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - name: Validate model metadata and browser chat
        run: |
          python3 -c 'import json; x=json.load(open("model/manifest.json")); assert len(x["revision"]) == 40 and len(x["sha256"]) == 64 and x["license"] == "Apache-2.0"'
          uv run --with-requirements requirements.txt --with pytest pytest -q tests/test_services.py::test_gateway_serves_web_chat

  verify:
    name: "Verify | Parallel checks passed"
    needs: [app_tests, helm_checks, infrastructure_checks, container_checks, model_web_checks]
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - run: echo "All five independent check branches passed."

  release:
    name: "Release | Docker Kind Helm Web Chat"
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'release'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    environment: laptop-release
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/pipeline.sh release dev

  full_scan:
    name: "Full Scan | Trivy SBOM Docker"
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'full'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/pipeline.sh full

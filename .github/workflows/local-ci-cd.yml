name: Local DevSecOps CI CD
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: "Run a lightweight check, local release, or full scan"
        required: true
        default: check
        type: choice
        options: [check, release, full]

permissions:
  contents: read

concurrency:
  group: local-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: "Check | Pytest Ruff Helm Hadolint"
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run two tests, Python lint and Helm lint
        run: ./scripts/pipeline.sh check
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: "Release | Docker Kind Helm Web Chat"
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'release'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    timeout-minutes: 120
    environment: laptop-release
    steps:
      - uses: actions/checkout@v4
      - name: Release to local Kind
        run: ./scripts/pipeline.sh release dev
      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  full_scan:
    name: "Full Scan | Trivy SBOM Docker"
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'full'
    runs-on: [self-hosted, macOS, ARM64, local-llm]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and scan all images
        run: ./scripts/pipeline.sh full
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-scan-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14


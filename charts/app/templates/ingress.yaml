apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
{{- if .Values.ipAllowList.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-allow-local@kubernetescrd"
{{- end }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host | quote }}]
      secretName: {{ .Values.tlsSecret }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend: {service: {name: gateway, port: {number: 8000}}}
          - path: /api/v1
            pathType: Prefix
            backend: {service: {name: gateway, port: {number: 8000}}}
          - path: /healthz
            pathType: Exact
            backend: {service: {name: gateway, port: {number: 8000}}}
{{- if .Values.ipAllowList.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: allow-local}
spec:
  ipAllowList:
    sourceRange:
{{- range .Values.allowedCIDRs }}
      - {{ . | quote }}
{{- end }}
{{- end }}


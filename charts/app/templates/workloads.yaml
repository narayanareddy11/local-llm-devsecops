{{- range $role := list "gateway" "catalog" "assistant" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $role }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $role }}
spec:
  replicas: {{ (index $.Values $role).replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: {{ $role }}}}
  template:
    metadata:
      labels: {app: {{ $role }}}
    spec:
      serviceAccountName: {{ $role }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $role }}
          image: local-llm/{{ $role }}:{{ $.Values.imageTag }}
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: CATALOG_URL, value: "http://catalog:8000"}
            - {name: ASSISTANT_URL, value: "http://assistant:8000"}
            - {name: LLM_URL, value: "http://llm:8080"}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $role }}}
spec:
  type: ClusterIP
  selector: {app: {{ $role }}}
  ports: [{name: http, port: 8000, targetPort: http}]
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: llm}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: model-weights}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: llm}
spec:
  replicas: {{ .Values.llm.replicas }}
  selector: {matchLabels: {app: llm}}
  strategy: {type: Recreate}
  template:
    metadata: {labels: {app: llm}}
    spec:
      serviceAccountName: llm
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: llm
          image: local-llm/llm:{{ .Values.imageTag }}
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: model, mountPath: /models, readOnly: true}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 12}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30}
      volumes: [{name: model, persistentVolumeClaim: {claimName: model-weights}}]
---
apiVersion: v1
kind: Service
metadata: {name: llm}
spec:
  type: ClusterIP
  selector: {app: llm}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gateway}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: gateway}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: gateway}}


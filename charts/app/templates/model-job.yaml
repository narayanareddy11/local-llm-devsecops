apiVersion: v1
kind: ServiceAccount
metadata: {name: model-job}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: model-job
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: download
          image: local-llm/gateway:{{ .Values.imageTag }}
          imagePullPolicy: Never
          command: [python, -m, jobs.model, download]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: model, mountPath: /models}]
      volumes: [{name: model, persistentVolumeClaim: {claimName: model-weights}}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: model-check}
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: model-job
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: check
              image: local-llm/gateway:{{ .Values.imageTag }}
              imagePullPolicy: Never
              command: [python, -m, jobs.model, evaluate]
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
              volumeMounts: [{name: model, mountPath: /models, readOnly: true}]
          volumes: [{name: model, persistentVolumeClaim: {claimName: model-weights}}]

